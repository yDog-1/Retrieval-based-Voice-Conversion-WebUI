[project]
name = "rvc-webui"
version = "0.1.0"
description = "Retrieval-based voice conversion WebUI and realtime GUI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1+cu118",
  "torchaudio==2.7.1+cu118",
  "setuptools>=75,<81", "wheel>=0.45,<1", "packaging>=24",
  "av>=15.1,<16", "einops>=0.8,<1", "faiss-cpu>=1.13,<2",
  "ffmpeg-python>=0.2,<1", "FreeSimpleGUI>=5.1,<5.2",
  "librosa>=0.10.2,<0.11", "local-attention>=1.11,<2",
  "matplotlib>=3.8.2,<4", "networkx>=3.2,<4", "numpy>=1.26.4,<2",
  "pymss==2.0.14", "pymss-core==0.1.4",
  "onnxruntime-gpu>=1.18,<1.19", "coloredlogs>=15,<16",
  "nvidia-cublas-cu11==11.11.3.6",
  "nvidia-cuda-runtime-cu11==11.8.89", "nvidia-cuda-nvrtc-cu11==11.8.89",
  "nvidia-cufft-cu11==10.9.0.58",
  "opencv-python-headless>=4.10,<5", "praat-parselmouth>=0.4.5,<1",
  "PyYAML>=6.0.1", "scikit-learn>=1.6,<2", "scipy>=1.13.1,<2",
  "sounddevice>=0.5,<1", "soundfile>=0.13,<1", "tensorboard>=2.19",
  "torchfcpe>=0.0.4,<0.1", "tqdm>=4.67,<5", "transformers>=4.49,<4.50",
  "gradio>=3.14,<3.15", "altair>=4.2,<5", "anyio>=3.6.2,<4",
  "fastapi>=0.88,<0.100", "httpx>=0.23,<0.24",
  "markdown-it-py>=2.2,<3", "mdit-py-plugins>=0.3.3,<0.4",
  "pydantic>=1.10.13,<2", "pyparsing>=3.0.9,<3.1",
  "starlette>=0.22,<0.28", "uvicorn>=0.20,<0.23", "websockets>=10.4,<11",
  "huggingface-hub>=0.28,<1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
